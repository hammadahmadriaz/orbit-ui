version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # tsup's type generation needs the TypeScript 5/6 compiler API.
      # Upgrade TypeScript majors by hand after checking that "pnpm build" passes.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Next.js and React majors need manual migration.
      - dependency-name: next
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
